name: SonarCloud

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  tests-backend:
    name: Tests backend Python
    runs-on: windows-latest

    steps:
      - name: Habilitar rutas largas en Git
        run: git config --global core.longpaths true

      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
          pip install flask flask-cors werkzeug requests python-docx pypdf mammoth reportlab docx2pdf pywin32

      - name: Ejecutar pruebas Python y generar cobertura
        run: |
          python -m pytest backend/test --cov=backend --cov-report=xml:coverage.xml

      - name: Guardar cobertura Python
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml

  sonarcloud:
    name: SonarCloud backend y frontend
    runs-on: ubuntu-latest
   # needs: tests-backend

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      #- name: Descargar cobertura Python
      #  uses: actions/download-artifact@v4
      #  with:
      #    name: python-coverage
      #    path: .

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"

      - name: Instalar dependencias frontend
        run: npm install

      - name: Ejecutar tests frontend
        run: npm run test:frontend

      - name: Configurar Node para Sonar
        run: |
          node -v
          echo "sonar.nodejs.executable=$(which node)" >> sonar-project.properties
      
      - name: Verificar cobertura frontend
        run: |
          ls -la coverage/frontend
          cat coverage/frontend/lcov.info | head

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=lissetsofia_Software-con-IA-Language-Tool-para-Generar-Cuadernillos-Mediante-Banco-de-Preguntas-de-Ex-menes-
            -Dsonar.organization=lissetsofia
            -Dsonar.sources=frontend
            -Dsonar.tests=frontend/__tests__
            -Dsonar.javascript.lcov.reportPaths=coverage/frontend/lcov.info
            -Dsonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/build/**,**/__tests__/**,frontend/libs/**,frontend/img/**,frontend/docs/**,frontend/jest.frontend.config.js,frontend/package-json-fragment.txt





          #  -Dsonar.sources=backend,frontend
          #  -Dsonar.tests=backend/test,frontend/__tests__
          #  -Dsonar.python.coverage.reportPaths=coverage.xml
          #  -Dsonar.javascript.lcov.reportPaths=coverage/frontend/lcov.info
          #  -Dsonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/build/**,**/__tests__/**,frontend/libs/**,frontend/img/**,frontend/docs/**,frontend/jest.frontend.config.js,frontend/package-json-fragment.txt,backend/db.py,backend/init_db.py,backend/login_api.py