name: SonarCloud

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: Analisis SonarCloud con cobertura Python
    runs-on: windows-latest

    steps:
      - name: Habilitar rutas largas en Git
        run: git config --global core.longpaths true

      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
          pip install flask flask-cors werkzeug requests python-docx pypdf mammoth reportlab docx2pdf pywin32

      - name: Ejecutar pruebas Python y generar cobertura
        run: |
          python -m pytest backend/test --cov=backend --cov-report=xml:coverage.xml

      - name: Analizar con SonarCloud
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}